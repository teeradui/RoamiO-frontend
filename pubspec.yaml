name: roamio_frontend
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  hugeicons: ^1.1.7
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  ming_cute_icons: ^0.0.8
  image_picker: ^1.2.3
